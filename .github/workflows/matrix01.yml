name: matrix flow

#on: push

jobs:
    matrix-deploy:
        strategy:
          fail-fast: false
          max-parallel: 2    
          matrix:
            os: [ubuntu-latest, ubuntu-24.04, windows-latest]  
            images: [alpine, hello-world]
            exclude:
                - images: alpine
                  os: windows-latest
            include:
                - images: amd64/alpine
                  os: ubuntu-24.04      
        runs-on: ${{ matrix.os }}
        steps: 
          - name: Echo Docker details
            run: docker info

          - name: Run images
            run : docker run ${{ matrix.images }}  

        